<style>
:root{
  --deep:#0E2740;
  --mid2:#153A5C;
  --line:#3E6C93;
  --line-soft:#264A6B;
  --ink:#EAF3FB;
  --muted:#9BB6CC;
  --gold:#D9A54C;
  --gold-soft:#E9C583;

  --display:"Shippori Mincho B1",serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100svh;
  background:
    repeating-linear-gradient(0deg, var(--line-soft) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 28px),
    var(--deep);
  color:var(--ink);
  font-family:var(--body);
  line-height:1.75;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem 1rem;
  -webkit-font-smoothing:antialiased;
}

.card{
  position:relative;
  width:100%;
  max-width:23rem;
  background:linear-gradient(180deg, rgba(21,58,92,.55), rgba(14,39,64,.75));
  border:1px solid var(--line);
  border-radius:2px;
  padding:2.6rem 1.9rem 2.2rem;
  backdrop-filter:blur(2px);
}

/* 図面の隅の合わせマーク */
.corner{position:absolute;width:1.15rem;height:1.15rem;border:2px solid var(--gold)}
.corner--tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
.corner--tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
.corner--bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
.corner--br{bottom:-1px;right:-1px;border-left:0;border-top:0}

.eyebrow{
  font-family:var(--mono);
  font-size:.68rem;letter-spacing:.16em;
  color:var(--muted);
  margin:0 0 1.6rem;
}

h1{
  font-family:var(--display);
  font-weight:700;
  font-size:2.15rem;
  margin:0 0 .35rem;
  color:#fff;
  letter-spacing:.02em;
}
.alias{
  margin:0 0 .2rem;
  font-size:1.15rem;
  color:var(--gold-soft);
}
.alias .reading{
  font-size:.78rem;
  color:var(--muted);
  margin-left:.5rem;
}
.title{
  font-family:var(--mono);
  font-size:.85rem;
  letter-spacing:.06em;
  color:var(--ink);
  margin:.9rem 0 .3rem;
}
.tagline{
  font-size:.9rem;
  color:var(--muted);
  margin:0;
}

.rule{height:1px;background:var(--line-soft);margin:1.5rem 0}

.meta-row{
  display:flex;justify-content:space-between;gap:1rem;
  font-size:.88rem;padding:.35rem 0;
}
.meta-row .k{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
  color:var(--muted);white-space:nowrap;padding-top:.15rem;
}
.meta-row .v{text-align:right;color:var(--ink)}

.contact{display:flex;flex-direction:column;gap:.7rem}
.contact-link{
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--line-soft);
  padding-bottom:.6rem;
}
.contact-link .k{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--muted);
}
.contact-link .v{font-size:.92rem}

.links{display:flex;flex-direction:column;gap:.65rem}
.links a{
  color:var(--ink);text-decoration:none;font-size:.92rem;
  display:flex;align-items:center;gap:.6rem;
}
.links a::before{
  content:"";width:.4rem;height:.4rem;background:var(--gold);flex:none;
}

.save-btn{
  display:block;text-align:center;
  margin-top:1.9rem;
  padding:.95rem 1rem;
  background:var(--gold);
  color:#1A1305;
  font-weight:700;
  text-decoration:none;
  font-size:.95rem;
  letter-spacing:.03em;
  border-radius:2px;
}
.save-btn:active{background:var(--gold-soft)}

.quote{
  margin:1.7rem 0 0;
  font-size:.8rem;
  color:var(--muted);
  border-left:2px solid var(--gold);
  padding-left:.8rem;
  line-height:1.9;
}
</style>
</head>
